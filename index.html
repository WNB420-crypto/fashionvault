<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNC FashionVault</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:sans-serif;background:#F5F7FA;color:#1A2B3C}
    #error-box{display:none;background:#FF5252;color:#fff;padding:20px;font-size:13px;white-space:pre-wrap;word-break:break-all;position:fixed;top:0;left:0;right:0;z-index:9999;max-height:50vh;overflow:auto}
  </style>
</head>
<body>
<div id="error-box"></div>
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F7FA">
  <div style="text-align:center;color:#8C9BAB">
    <div style="font-size:48px;margin-bottom:12px">👗</div>
    <div style="font-size:16px;font-weight:700">Loading VNC FashionVault…</div>
    <div style="font-size:13px;margin-top:8px" id="load-status">Initializing…</div>
  </div>
</div>

<script>
// Catch all errors and show them on screen
window.onerror = function(msg, src, line, col, err) {
  var box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = 'JS ERROR:\n' + msg + '\nLine: ' + line + '\nFile: ' + src + '\n\n' + (err ? err.stack : '');
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = (box.textContent || '') + '\nPROMISE ERROR:\n' + e.reason;
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"
  onerror="document.getElementById('error-box').style.display='block';document.getElementById('error-box').textContent='FAILED TO LOAD REACT from cdnjs'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"
  onerror="document.getElementById('error-box').style.display='block';document.getElementById('error-box').textContent='FAILED TO LOAD REACT-DOM from cdnjs'"></script>

<script>
document.getElementById('load-status').textContent = 'React loaded: ' + (typeof React !== 'undefined') + ' | ReactDOM: ' + (typeof ReactDOM !== 'undefined');

try {
  var e = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useRef = React.useRef;

  // Colors
  var G="#00C853",GL="#E8FFF2",A="#FFB300",AL="#FFF8E1",N="#0D1B2A",C="#FF5252",W="#FFFFFF",BG="#F5F7FA",BD="#E2E8F0",MID="#8C9BAB",DK="#1A2B3C";

  var FASHION_AI = "You are VAULTAI, the AI placement engine for VNC FashionVault. You place clothing brands with stylists, influencers, and retail buyers. Be direct, strategic, results-focused. Every answer has an action in it.";

  var INIT_CLIENTS = [
    {id:1,name:"AUREUM NOIR",category:"Luxury RTW",status:"Active",placements:14,revenue:52400,tier:"Gold",pieces:28,contact:"aria@aureumnoir.com"},
    {id:2,name:"VOID STUDIOS",category:"Streetwear",status:"Outreach",placements:6,revenue:14800,tier:"Silver",pieces:18,contact:"kai@voidstudios.co"},
    {id:3,name:"TERRA CO.",category:"Sustainable",status:"Negotiation",placements:9,revenue:33200,tier:"Gold",pieces:34,contact:"maya@terracollective.com"},
    {id:4,name:"NXGEN ATELIER",category:"Avant-Garde",status:"Intake",placements:0,revenue:0,tier:"Starter",pieces:12,contact:"leo@nxgenatelier.com"},
  ];

  var statusColor={Active:G,Outreach:A,Negotiation:C,Intake:MID};

  function Btn(props) {
    return e('button',{
      onClick:props.onClick, disabled:props.disabled,
      style:{background:props.disabled?BD:(props.color||G),color:W,border:'none',borderRadius:'10px',
        padding:props.sm?'7px 14px':'11px 22px',fontSize:props.sm?'12px':'13px',fontWeight:'700',
        cursor:props.disabled?'not-allowed':'pointer',width:props.full?'100%':'auto',
        letterSpacing:'0.02em',transition:'opacity 0.15s',fontFamily:'sans-serif'}
    }, props.children);
  }

  function Card(props) {
    return e('div',{style:Object.assign({background:W,borderRadius:'16px',border:'1px solid '+BD,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.05)'},props.style||{})},props.children);
  }

  function StatTile(props) {
    return e(Card,{style:{flex:1,minWidth:'140px'}},
      e('div',{style:{fontSize:'11px',fontWeight:'700',color:MID,letterSpacing:'0.08em',marginBottom:'8px',textTransform:'uppercase'}},props.label),
      e('div',{style:{fontSize:'28px',fontWeight:'800',color:props.color||G,lineHeight:1}},props.value),
      props.sub&&e('div',{style:{fontSize:'12px',color:MID,marginTop:'4px'}},props.sub)
    );
  }

  function KeyModal(props) {
    var state = React.useState('');
    var k = state[0], setK = state[1];
    return e('div',{style:{position:'fixed',inset:0,background:'rgba(13,27,42,0.75)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:'20px'}},
      e(Card,{style:{maxWidth:'420px',width:'100%'}},
        e('div',{style:{textAlign:'center',marginBottom:'20px'}},
          e('div',{style:{fontSize:'36px',marginBottom:'8px'}},'🔑'),
          e('div',{style:{fontSize:'20px',fontWeight:'800',color:DK}},'Connect Your AI'),
          e('div',{style:{fontSize:'13px',color:MID,marginTop:'4px'}},'Enter your Anthropic API key to activate VAULTAI')
        ),
        e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'API Key *'),
        e('input',{type:'password',value:k,onChange:function(ev){setK(ev.target.value)},placeholder:'sk-ant-…',
          style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',marginBottom:'16px',boxSizing:'border-box',fontFamily:'sans-serif'}}),
        e('div',{style:{fontSize:'11px',color:MID,marginBottom:'16px'}},'Stored in your browser. Get one at console.anthropic.com'),
        e(Btn,{onClick:function(){k.startsWith('sk-')&&props.onSave(k)},disabled:!k.startsWith('sk-'),full:true},'🚀 Activate VAULTAI')
      )
    );
  }

  function AIChat(props) {
    var msgsState = React.useState([{role:'assistant',content:'VAULTAI online. Locked in on '+props.client.name+' — '+props.client.category+', '+props.client.placements+' placements, $'+props.client.revenue.toLocaleString()+' revenue. What\'s the move?'}]);
    var msgs = msgsState[0], setMsgs = msgsState[1];
    var inputState = React.useState('');
    var input = inputState[0], setInput = inputState[1];
    var loadingState = React.useState(false);
    var loading = loadingState[0], setLoading = loadingState[1];
    var bottomRef = React.useRef(null);

    React.useEffect(function(){bottomRef.current&&bottomRef.current.scrollIntoView({behavior:'smooth'})},[msgs]);

    function send() {
      if(!input.trim()||loading) return;
      var userMsg=input.trim();
      setInput('');
      setMsgs(function(m){return m.concat([{role:'user',content:userMsg}])});
      setLoading(true);
      fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':props.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,system:FASHION_AI,messages:msgs.concat([{role:'user',content:userMsg}])})
      }).then(function(r){return r.json()}).then(function(d){
        setMsgs(function(m){return m.concat([{role:'assistant',content:d.content&&d.content[0]?d.content[0].text:'No response.'}])});
        setLoading(false);
      }).catch(function(){
        setMsgs(function(m){return m.concat([{role:'assistant',content:'Connection error. Check your API key.'}])});
        setLoading(false);
      });
    }

    return e('div',{style:{display:'flex',flexDirection:'column',height:'420px',background:BG,borderRadius:'12px',overflow:'hidden',border:'1px solid '+BD}},
      e('div',{style:{background:N,padding:'12px 16px',display:'flex',alignItems:'center',gap:'8px'}},
        e('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:G}}),
        e('div',{style:{fontWeight:'700',fontSize:'13px',color:W}},'VAULTAI — '+props.client.name)
      ),
      e('div',{style:{flex:1,overflowY:'auto',padding:'16px'}},
        msgs.map(function(m,i){
          var isAI=m.role==='assistant';
          return e('div',{key:i,style:{display:'flex',justifyContent:isAI?'flex-start':'flex-end',marginBottom:'10px'}},
            e('div',{style:{maxWidth:'85%',padding:'10px 14px',borderRadius:isAI?'4px 14px 14px 14px':'14px 4px 14px 14px',
              background:isAI?W:G,color:isAI?DK:W,fontSize:'13px',lineHeight:1.6,
              border:isAI?'1px solid '+BD:'none'}},m.content)
          );
        }),
        loading&&e('div',{style:{padding:'8px',color:MID,fontSize:'13px'}},'VAULTAI thinking…'),
        e('div',{ref:bottomRef})
      ),
      e('div',{style:{padding:'12px',background:W,borderTop:'1px solid '+BD,display:'flex',gap:'8px'}},
        e('input',{value:input,onChange:function(ev){setInput(ev.target.value)},
          onKeyDown:function(ev){ev.key==='Enter'&&send()},
          placeholder:'Ask VAULTAI…',
          style:{flex:1,border:'1.5px solid '+BD,borderRadius:'10px',padding:'10px 14px',fontSize:'14px',fontFamily:'sans-serif'}}),
        e(Btn,{onClick:send,disabled:!input.trim()||loading,sm:true},'Send')
      )
    );
  }

  function Dashboard(props) {
    var selState = React.useState(null);
    var sel = selState[0], setSel = selState[1];
    var tabState = React.useState('overview');
    var tab = tabState[0], setTab = tabState[1];
    var clients = props.clients;
    var totalRev = clients.reduce(function(s,c){return s+c.revenue},0);
    var totalPl = clients.reduce(function(s,c){return s+c.placements},0);

    return e('div',{style:{minHeight:'100vh',background:BG}},
      // Nav
      e('div',{style:{background:N,padding:'0 16px',display:'flex',alignItems:'center',flexWrap:'wrap',gap:'8px',position:'sticky',top:0,zIndex:100}},
        e('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'12px 0',marginRight:'auto'}},
          e('span',{style:{fontSize:'20px'}},'👗'),
          e('span',{style:{fontWeight:'800',fontSize:'15px',color:W,letterSpacing:'0.05em'}},'VNC FASHIONVAULT')
        ),
        e('div',{style:{display:'flex',gap:'4px'}},
          ['overview','clients'].map(function(t){
            return e('button',{key:t,onClick:function(){setTab(t)},
              style:{background:tab===t?'rgba(0,200,83,0.2)':'transparent',color:tab===t?G:'rgba(255,255,255,0.6)',
                border:'none',padding:'8px 12px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700',textTransform:'capitalize',fontFamily:'sans-serif'}},t);
          })
        ),
        e('div',{style:{display:'flex',gap:'6px'}},
          e('button',{onClick:props.onKeyClick,style:{background:'rgba(255,179,0,0.2)',color:A,border:'none',padding:'7px 12px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700',fontFamily:'sans-serif'}},'🔑 API'),
          e('button',{onClick:function(){props.setView('backend')},style:{background:'rgba(255,255,255,0.1)',color:W,border:'none',padding:'7px 12px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700',fontFamily:'sans-serif'}},'ADMIN'),
          e('button',{onClick:function(){props.setView('onboarding')},style:{background:G,color:W,border:'none',padding:'7px 12px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700',fontFamily:'sans-serif'}},'+NEW')
        )
      ),
      e('div',{style:{padding:'16px',maxWidth:'900px',margin:'0 auto'}},
        tab==='overview'&&e('div',{},
          e('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap',marginBottom:'16px'}},
            e(StatTile,{label:'Revenue',value:'$'+totalRev.toLocaleString(),sub:'All clients',color:G}),
            e(StatTile,{label:'Placements',value:totalPl,sub:'Active',color:A}),
            e(StatTile,{label:'Clients',value:clients.length,sub:'In vault',color:C}),
            e(StatTile,{label:'Active',value:clients.filter(function(c){return c.status==='Active'}).length,sub:'Running',color:N})
          ),
          e('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:'10px'}},
            clients.map(function(c){
              var sc=statusColor[c.status]||MID;
              return e(Card,{key:c.id},
                e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px'}},
                  e('div',{style:{fontWeight:'800',fontSize:'14px',color:DK}},c.name),
                  e('div',{style:{padding:'2px 8px',borderRadius:'20px',fontSize:'11px',fontWeight:'700',background:sc+'22',color:sc}},c.status)
                ),
                e('div',{style:{fontSize:'12px',color:MID,marginBottom:'8px'}},c.category+' · '+c.tier),
                e('div',{style:{display:'flex',gap:'16px'}},
                  e('div',{},e('div',{style:{fontSize:'20px',fontWeight:'800',color:G}},c.placements),e('div',{style:{fontSize:'10px',color:MID}},'PLACEMENTS')),
                  e('div',{},e('div',{style:{fontSize:'20px',fontWeight:'800',color:A}},'$'+c.revenue.toLocaleString()),e('div',{style:{fontSize:'10px',color:MID}},'REVENUE'))
                )
              );
            })
          )
        ),
        tab==='clients'&&e('div',{},
          e('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:'10px',marginBottom:'16px'}},
            clients.map(function(c){
              var sc=statusColor[c.status]||MID;
              return e('div',{key:c.id,onClick:function(){setSel(c)},
                style:{background:W,borderRadius:'14px',border:'2px solid '+(sel&&sel.id===c.id?G:BD),padding:'16px',cursor:'pointer'}},
                e('div',{style:{fontWeight:'800',fontSize:'14px',color:DK,marginBottom:'4px'}},c.name),
                e('div',{style:{fontSize:'12px',color:MID,marginBottom:'8px'}},c.category),
                e('div',{style:{padding:'2px 8px',borderRadius:'20px',fontSize:'11px',fontWeight:'700',background:sc+'22',color:sc,display:'inline-block'}},c.status)
              );
            })
          ),
          sel&&e(Card,{},
            e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}},
              e('div',{style:{fontWeight:'800',color:DK}},'VAULTAI — '+sel.name),
              e('button',{onClick:function(){setSel(null)},style:{background:'none',border:'none',fontSize:'18px',cursor:'pointer',color:MID}},'✕')
            ),
            props.apiKey
              ?e(AIChat,{client:sel,apiKey:props.apiKey})
              :e('div',{style:{padding:'40px',textAlign:'center',color:MID}},
                  e('div',{style:{fontSize:'24px',marginBottom:'8px'}},'🔑'),
                  e('div',{style:{fontWeight:'600',marginBottom:'12px'}},'Add API key to chat with VAULTAI'),
                  e(Btn,{onClick:props.onKeyClick,color:A},'Add API Key')
                )
          )
        )
      )
    );
  }

  function Onboarding(props) {
    var stepState = React.useState(0);
    var step = stepState[0], setStep = stepState[1];
    var dataState = React.useState({brandName:'',category:'Streetwear',pieces:'',email:''});
    var data = dataState[0], setData = dataState[1];
    function up(k,v){setData(function(d){var n=Object.assign({},d);n[k]=v;return n});}
    var cats=['Streetwear','Luxury RTW','Contemporary','Athleisure','Sustainable','Avant-Garde','Accessories'];

    return e('div',{style:{minHeight:'100vh',background:BG}},
      e('div',{style:{background:N,padding:'14px 16px',display:'flex',alignItems:'center',gap:'8px'}},
        e('span',{style:{fontSize:'20px'}},'👗'),
        e('span',{style:{fontWeight:'800',fontSize:'15px',color:W,letterSpacing:'0.04em'}},'NEW CLIENT INTAKE'),
        e('span',{style:{marginLeft:'auto',fontSize:'12px',color:'rgba(255,255,255,0.5)'}},step+1+'/3')
      ),
      e('div',{style:{padding:'20px 16px',maxWidth:'480px',margin:'0 auto'}},
        e(Card,{},
          step===0&&e('div',{},
            e('div',{style:{fontSize:'20px',fontWeight:'800',color:DK,marginBottom:'16px'}},'Brand Info'),
            e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'Brand Name *'),
            e('input',{value:data.brandName,onChange:function(ev){up('brandName',ev.target.value)},placeholder:'e.g. VOID STUDIOS',
              style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',marginBottom:'14px',boxSizing:'border-box',fontFamily:'sans-serif'}}),
            e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'Category'),
            e('select',{value:data.category,onChange:function(ev){up('category',ev.target.value)},
              style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',boxSizing:'border-box',fontFamily:'sans-serif'}},
              cats.map(function(c){return e('option',{key:c,value:c},c)}))
          ),
          step===1&&e('div',{},
            e('div',{style:{fontSize:'20px',fontWeight:'800',color:DK,marginBottom:'16px'}},'Collection Details'),
            e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'# of Pieces'),
            e('input',{type:'number',value:data.pieces,onChange:function(ev){up('pieces',ev.target.value)},placeholder:'e.g. 24',
              style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',boxSizing:'border-box',fontFamily:'sans-serif'}})
          ),
          step===2&&e('div',{style:{textAlign:'center',padding:'20px 0'}},
            e('div',{style:{fontSize:'48px',marginBottom:'16px'}},'🎯'),
            e('div',{style:{fontSize:'22px',fontWeight:'800',color:DK,marginBottom:'8px'}},'You\'re All Set!'),
            e('div',{style:{fontSize:'14px',color:MID,marginBottom:'20px'}},'VAULTAI will begin building your placement pipeline.'),
            e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'Contact Email *'),
            e('input',{type:'email',value:data.email,onChange:function(ev){up('email',ev.target.value)},placeholder:'you@brand.com',
              style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',marginBottom:'4px',boxSizing:'border-box',fontFamily:'sans-serif'}})
          )
        )
      ),
      e('div',{style:{padding:'16px',display:'flex',justifyContent:'flex-end',gap:'10px',background:W,borderTop:'1px solid '+BD}},
        step>0&&e(Btn,{onClick:function(){setStep(function(s){return s-1})},color:N},'← Back'),
        step<2
          ?e(Btn,{onClick:function(){setStep(function(s){return s+1})},disabled:step===0&&!data.brandName},'Continue →')
          :e(Btn,{onClick:function(){
              props.onComplete(data);
            }},'🚀 Launch Campaign')
      )
    );
  }

  function Backend(props) {
    var pwdState = React.useState('');
    var pwd = pwdState[0], setPwd = pwdState[1];
    var authState = React.useState(false);
    var authed = authState[0], setAuthed = authState[1];
    var errState = React.useState(false);
    var err = errState[0], setErr = errState[1];

    if(!authed) return e('div',{style:{minHeight:'100vh',background:N,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}},
      e(Card,{style:{maxWidth:'360px',width:'100%'}},
        e('div',{style:{textAlign:'center',marginBottom:'20px'}},
          e('div',{style:{fontSize:'36px',marginBottom:'8px'}},'🔒'),
          e('div',{style:{fontSize:'20px',fontWeight:'800',color:DK}}, 'Backend Access')
        ),
        e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'Password'),
        e('input',{type:'password',value:pwd,onChange:function(ev){setPwd(ev.target.value);setErr(false)},
          style:{width:'100%',border:'1.5px solid '+(err?C:BD),borderRadius:'10px',padding:'11px 14px',fontSize:'14px',marginBottom:'12px',boxSizing:'border-box',fontFamily:'sans-serif'}}),
        err&&e('div',{style:{color:C,fontSize:'13px',fontWeight:'600',marginBottom:'10px'}},'Incorrect password'),
        e(Btn,{onClick:function(){pwd==='VNC2026'?setAuthed(true):setErr(true)},full:true,color:N},'🔓 Access Backend'),
        e('div',{style:{textAlign:'center',marginTop:'12px'}},
          e('button',{onClick:function(){props.setView('dashboard')},style:{background:'none',border:'none',color:MID,cursor:'pointer',fontSize:'13px',textDecoration:'underline',fontFamily:'sans-serif'}},'← Back to Dashboard')
        )
      )
    );

    return e('div',{style:{minHeight:'100vh',background:BG}},
      e('div',{style:{background:N,padding:'14px 16px',display:'flex',alignItems:'center',gap:'8px'}},
        e('span',{style:{fontSize:'20px'}},'🔒'),
        e('span',{style:{fontWeight:'800',fontSize:'15px',color:W,letterSpacing:'0.04em'}},'FASHIONVAULT BACKEND'),
        e('button',{onClick:function(){props.setView('dashboard')},style:{marginLeft:'auto',background:'rgba(255,255,255,0.1)',color:W,border:'none',padding:'7px 12px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700',fontFamily:'sans-serif'}},'← Dashboard')
      ),
      e('div',{style:{padding:'16px',maxWidth:'800px',margin:'0 auto'}},
        e('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap',marginBottom:'16px'}},
          e(StatTile,{label:'Clients',value:props.clients.length,color:G}),
          e(StatTile,{label:'Revenue',value:'$'+props.clients.reduce(function(s,c){return s+c.revenue},0).toLocaleString(),color:A}),
          e(StatTile,{label:'Placements',value:props.clients.reduce(function(s,c){return s+c.placements},0),color:C})
        ),
        e(Card,{},
          e('div',{style:{fontWeight:'800',fontSize:'14px',marginBottom:'14px',color:DK}},'CLIENT ROSTER'),
          props.clients.map(function(c,i){
            var sc=statusColor[c.status]||MID;
            return e('div',{key:c.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:i<props.clients.length-1?'1px solid '+BD:'none'}},
              e('div',{},
                e('div',{style:{fontWeight:'700',color:DK}},c.name),
                e('div',{style:{fontSize:'12px',color:MID}},c.category+' · '+c.tier)
              ),
              e('div',{style:{textAlign:'right'}},
                e('div',{style:{padding:'2px 8px',borderRadius:'20px',fontSize:'11px',fontWeight:'700',background:sc+'22',color:sc}},c.status),
                e('div',{style:{fontSize:'12px',color:G,fontWeight:'700',marginTop:'2px'}},'$'+c.revenue.toLocaleString())
              )
            );
          })
        )
      )
    );
  }

  function App() {
    var viewState = React.useState('dashboard');
    var view = viewState[0], setView = viewState[1];
    var clientsState = React.useState(INIT_CLIENTS);
    var clients = clientsState[0], setClients = clientsState[1];
    var keyState = React.useState(function(){try{return localStorage.getItem('vaultai_key')||''}catch{return ''}});
    var apiKey = keyState[0], setApiKey = keyState[1];
    var showKeyState = React.useState(false);
    var showKey = showKeyState[0], setShowKey = showKeyState[1];

    function saveKey(k){setApiKey(k);try{localStorage.setItem('vaultai_key',k)}catch{}setShowKey(false);}
    function onboardComplete(data){
      if(data.brandName){
        setClients(function(cs){return cs.concat([{id:Date.now(),name:data.brandName.toUpperCase(),category:data.category,status:'Intake',placements:0,revenue:0,tier:'Starter',pieces:parseInt(data.pieces)||10,contact:data.email}])});
      }
      setView('dashboard');
    }

    return e('div',{},
      showKey&&e(KeyModal,{onSave:saveKey}),
      view==='onboarding'&&e(Onboarding,{onComplete:onboardComplete}),
      view==='dashboard'&&e(Dashboard,{clients:clients,setClients:setClients,setView:setView,apiKey:apiKey,onKeyClick:function(){setShowKey(true)}}),
      view==='backend'&&e(Backend,{clients:clients,setView:setView})
    );
  }

  document.getElementById('load-status').textContent = 'Mounting React app…';
  ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));

} catch(err) {
  var box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = 'SETUP ERROR:\n' + err.message + '\n\n' + err.stack;
}
</script>
</body>
</html>
