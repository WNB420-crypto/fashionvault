// Catch all errors and show them on screen
window.onerror = function(msg, src, line, col, err) {
  // Ignore cross-origin "Script error." with no file/line (CDN noise on Safari)
  if (msg === 'Script error.' && !src && line === 0) return true;
  if (msg === 'Script error.' && line === 0) return true;
  var box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = 'JS ERROR:\n' + msg + '\nLine: ' + line + '\nFile: ' + src + '\n\n' + (err ? err.stack : '');
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = (box.textContent || '') + '\nPROMISE ERROR:\n' + e.reason;
});
</script>

            e('span',{},'FASHIONVAULT / CREATIVE STUDIO'),
            e('span',{},'CONNECTED BY DESIGN.')
          )

        tab==='studio'&&e('div',{className:'ticker','aria-hidden':true},
          'FASHION MEETS TECHNOLOGY',
          e('span',{style:{margin:'0 8px',display:'inline-flex',verticalAlign:'middle'}},e(Icon,{name:'dot',size:8,color:G})),
          'CONNECTED BY DESIGN',
          e('span',{style:{margin:'0 8px',display:'inline-flex',verticalAlign:'middle'}},e(Icon,{name:'dot',size:8,color:G})),
          'YOUR NEXT CHAPTER',
          e('span',{style:{margin:'0 8px',display:'inline-flex',verticalAlign:'middle'}},e(Icon,{name:'dot',size:8,color:G})),
          'FASHION MEETS TECHNOLOGY'

        tab==='studio'&&e('section',{className:'circuit-explore','aria-label':'Explore clothing stations'},

          e('span',{className:'eyebrow'},'YOUR BIG PICTURE'),
          e('h1',{},'Watch your vision grow.'),
          e('p',{},'A snapshot of the brands and placements in your vault.')
        ),

        tab!=='brands'&&e('section',{className:'metrics','aria-label':'Workspace totals'},
          [['Total revenue','$'+cs.reduce(function(s,c){return s+c.revenue},0).toLocaleString(),'Across your brands'],['Placements',cs.reduce(function(s,c){return s+c.placements},0),'Moments in the spotlight'],['Brands in your vault',cs.length,'Individual visions. One space.'],['Active brands',cs.filter(function(c){return c.status==='Active'}).length,'Building their next chapter']].map(function(x,i){
            return e('div',{className:'metric',key:x[0]},
              e('div',{},x[0],e('span',{style:{marginLeft:'5px',display:'inline-flex',verticalAlign:'middle'}},e(Icon,{name:metricIcons[i],size:13,color:G}))),
              e('strong',{},x[1]),
              e('small',{},x[2])
            );
          })
        ),

        tab==='insights'
          ? e('section',{className:'insight-panel'},
              e('h2',{},'Every brand has a story.'),
              cs.map(function(c){
                var max=Math.max.apply(null,cs.map(function(x){return x.revenue}));
                return e('div',{className:'insight-row',key:c.id},
                  e('button',{onClick:function(){openBrand(c)}},c.name),
                  e('div',{className:'bar-track'},e('div',{style:{width:(max?c.revenue/max*100:0)+'%'}})),
                  e('span',{},'$'+c.revenue.toLocaleString())
                );
              })
            )
          : e('section',{className:'collections',id:'brand-collections'},
              e('div',{className:'section-title'},
                e('div',{},
                  e('span',{className:'eyebrow'},'CURATED BY YOU'),
                  e('h2',{},tab==='studio'?'Your brands. Your universe.':'Inside your vault.')
                ),
                e('button',{className:'text-link',onClick:function(){props.setView('onboarding')}},'+ Add a brand')
              ),
              e('div',{className:'collection-tools'},
                e('div',{className:'filters','aria-label':'Filter brands'},
                  categories.map(function(c){return e('button',{key:c,className:cat===c?'active':'',onClick:function(){setCat(c);setStation(c)}},c)})
                ),
                e('input',{type:'search','aria-label':'Search your brands',placeholder:'Search your vault…',value:q,onChange:function(ev){setQ(ev.target.value)}})
              ),
              e('div',{className:'brand-grid'},
                filtered.map(function(c,i){
                  return e('button',{className:'brand-card theme-'+(cs.indexOf(c)%4),key:c.id,onClick:function(){openBrand(c)}},
                    e('div',{className:'brand-art'},
                      e('span',{className:'status'},e('i'),c.status),
                      e('span',{className:'brand-index'},'0'+(cs.indexOf(c)+1)),
                      e('span',{className:'brand-visual','aria-hidden':true}),
                      e('span',{className:'art-category'},c.category),
                      e('span',{className:'art-arrow'},e(Icon,{name:'arrowDiag',size:12,color:G}))
                    ),
                    e('div',{className:'brand-info'},
                      e('h3',{},c.name),
                      e('p',{},c.category+' / '+c.pieces+' pieces'),
                      e('div',{className:'brand-numbers'},
                        e('span',{},e('b',{},c.placements),' placements'),
                        e('span',{},e('b',{},'$'+c.revenue.toLocaleString()),' revenue')
                      )
                    )
                  );
                }),
                filtered.length===0&&e('div',{className:'empty-state'},
                  e('h3',{},'A little room for discovery.'),
                  e('p',{},'Try another name or category.'),
                  e('button',{className:'secondary',onClick:function(){setQ('');setCat('All brands')}},'Reset filters')
                )
              )
            ),

        tab==='studio'&&e('section',{className:'ai-banner'},
          e('div',{className:'ai-orb'},e(Icon,{name:'star',size:28,color:G})),
          e('div',{},
            e('span',{className:'eyebrow'},'THE INTELLIGENCE IN YOUR CIRCUIT'),
            e('h2',{},'Your next move starts with an idea.'),
            e('p',{},'Explore placement strategies, sharpen a pitch, or find a fresh direction with VAULTAI.')
          ),
          e('button',{className:'secondary',onClick:function(){setTab('brands');if(cs.length)setSel(cs[0])}},
            'Step into VAULTAI ',
            e('span',{style:{display:'inline-flex',verticalAlign:'middle'}},e(Icon,{name:'arrowDiag',size:12,color:DK}))
          )
        ),

        e('footer',{},
          e('span',{},'FashionVault'),
          e('a',{href:'assets/brand-kit.png',target:'_blank',rel:'noopener'},'View brand kit ',e(Icon,{name:'arrowDiag',size:11,color:G})),
          e('span',{},'Connected by design.'),
          e('small',{},'Changes saved on this device · Add brands via the onboarding wizard')
        )
      ),

      sel&&e('div',{className:'modal-backdrop',onClick:function(ev){if(ev.target===ev.currentTarget)setSel(null)}},
        e('section',{className:'brand-modal',role:'dialog','aria-modal':true,'aria-label':sel.name,tabIndex:-1,
          onKeyDown:function(ev){
            if(ev.key==='Escape')setSel(null);
            if(ev.key==='Tab'){var f=ev.currentTarget.querySelectorAll('button,input,select,a[href]');if(f.length){var first=f[0],last=f[f.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}}
          }
        },
          e('button',{className:'close',autoFocus:true,'aria-label':'Close brand',onClick:function(){setSel(null)}},e(Icon,{name:'close',size:18,color:MID})),
          e('span',{className:'eyebrow'},'INSIDE THE VAULT / '+sel.category),
          e('h2',{},sel.name),
          e('p',{className:'detail-meta'},sel.pieces+' pieces · '+sel.placements+' placements · '+sel.status),
          e('div',{className:'contact-line'},sel.contact),
          props.apiKey
            ? e(AIChat,{key:sel.id,client:sel,apiKey:props.apiKey})
            : e('div',{className:'connect-state'},
                e('div',{className:'ai-orb'},e(Icon,{name:'star',size:28,color:G})),
                e('h3',{},'Let\'s shape your next move.'),
                e('p',{},'Connect your AI account to brainstorm placements and build your brand strategy.'),
                e('button',{className:'primary',onClick:props.onKeyClick},
                  'Connect VAULTAI ',
                  e('span',{style:{display:'inline-flex',verticalAlign:'middle'}},e(Icon,{name:'arrowDiag',size:12,color:'#10120D'}))
                )
              )
        )
      )
    );
  }

  function Onboarding(props) {
    var stepState = React.useState(0);
    var step = stepState[0], setStep = stepState[1];
    var dataState = React.useState({brandName:'',category:'Streetwear',pieces:'',email:''});
    var data = dataState[0], setData = dataState[1];
    function up(k,v){setData(function(d){var n=Object.assign({},d);n[k]=v;return n});}
    var cats=['Streetwear','Luxury RTW','Contemporary','Athleisure','Sustainable','Avant-Garde','Accessories'];

    return e('div',{style:{minHeight:'100vh',background:BG}},
      e('div',{style:{background:N,padding:'14px 16px',display:'flex',alignItems:'center',gap:'8px'}},
        e('span',{style:{display:'flex',alignItems:'center'}},e(Icon,{name:'hanger',size:22,color:G})),
        e('span',{style:{fontWeight:'800',fontSize:'15px',color:DK,letterSpacing:'0.04em'}},'YOUR NEXT CHAPTER'),
        e('span',{style:{marginLeft:'auto',fontSize:'12px',color:'rgba(255,255,255,0.5)'}},step+1+'/3')
      ),
      e('button',{className:'back-studio',onClick:props.onCancel},'← Back to the studio'),
      e('div',{style:{padding:'20px 16px',maxWidth:'480px',margin:'0 auto'}},
        e(Card,{},
          step===0&&e('div',{},
            e('div',{style:{fontSize:'20px',fontWeight:'800',color:DK,marginBottom:'16px'}},'First, make it yours.'),
            e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'Brand Name *'),
            e('input',{value:data.brandName,onChange:function(ev){up('brandName',ev.target.value)},placeholder:'e.g. VOID STUDIOS',
              style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',marginBottom:'14px',boxSizing:'border-box',fontFamily:'inherit'}}),
            e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'Category'),
            e('select',{value:data.category,onChange:function(ev){up('category',ev.target.value)},
              style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',boxSizing:'border-box',fontFamily:'inherit'}},
              cats.map(function(c){return e('option',{key:c,value:c},c)}))
          ),
          step===1&&e('div',{},
            e('div',{style:{fontSize:'20px',fontWeight:'800',color:DK,marginBottom:'16px'}},'Tell us about the collection.'),
            e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'# of Pieces'),
            e('input',{type:'number',min:0,step:1,value:data.pieces,onChange:function(ev){up('pieces',ev.target.value)},placeholder:'e.g. 24',
              style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',boxSizing:'border-box',fontFamily:'inherit'}})
          ),
          step===2&&e('div',{style:{textAlign:'center',padding:'20px 0'}},
            e('div',{style:{display:'flex',justifyContent:'center',marginBottom:'16px'}},e(Icon,{name:'target',size:52,color:G})),
            e('div',{style:{fontSize:'22px',fontWeight:'800',color:DK,marginBottom:'8px'}},'You\'re All Set!'),
            e('div',{style:{fontSize:'14px',color:MID,marginBottom:'20px'}},'Save your brand, then explore your next move with VAULTAI.'),
            e('label',{style:{fontSize:'12px',fontWeight:'700',color:DK,display:'block',marginBottom:'6px'}},'Contact Email *'),
            e('input',{type:'email',value:data.email,onChange:function(ev){up('email',ev.target.value)},placeholder:'you@brand.com',
              style:{width:'100%',border:'1.5px solid '+BD,borderRadius:'10px',padding:'11px 14px',fontSize:'14px',marginBottom:'4px',boxSizing:'border-box',fontFamily:'inherit'}})
          )
        )
      ),
      e('div',{style:{padding:'16px',display:'flex',justifyContent:'flex-end',gap:'10px',background:W,borderTop:'1px solid '+BD}},
        step>0&&e(Btn,{onClick:function(){setStep(function(s){return s-1})},color:N},'← Back'),
        step<2
          ?e(Btn,{onClick:function(){setStep(function(s){return s+1})},disabled:(step===0&&!data.brandName.trim())||(step===1&&(!/^\d+$/.test(data.pieces)))},'Continue →')
          :e(Btn,{onClick:function(){props.onComplete(data);},disabled:!/^\S+@\S+\.\S+$/.test(data.email)},'Add to my vault →')
      )
    );
  }

  function Backend(props) {
    return e('div',{style:{minHeight:'100vh',background:BG}},
      e('div',{style:{background:N,padding:'14px 16px',display:'flex',alignItems:'center',gap:'8px'}},
        e('span',{style:{display:'flex',alignItems:'center'}},e(Icon,{name:'lock',size:20,color:G})),
        e('span',{style:{fontWeight:'800',fontSize:'15px',color:DK,letterSpacing:'0.04em'}},'YOUR BRAND ROSTER'),
        e('button',{onClick:function(){props.setView('dashboard')},style:{marginLeft:'auto',background:'rgba(255,255,255,0.1)',color:DK,border:'none',padding:'7px 12px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700',fontFamily:'inherit'}},'← Dashboard')
      ),
      e('div',{style:{padding:'16px',maxWidth:'800px',margin:'0 auto'}},
        e('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap',marginBottom:'16px'}},
          e(StatTile,{label:'Clients',value:props.clients.length,color:G}),
          e(StatTile,{label:'Revenue',value:'$'+props.clients.reduce(function(s,c){return s+c.revenue},0).toLocaleString(),color:A}),
          e(StatTile,{label:'Placements',value:props.clients.reduce(function(s,c){return s+c.placements},0),color:C})
        ),
        e(Card,{},
          e('div',{style:{fontWeight:'800',fontSize:'14px',marginBottom:'14px',color:DK}},'CLIENT ROSTER'),
          props.clients.map(function(c,i){
            var sc=statusColor[c.status]||MID;
            return e('div',{key:c.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 0',borderBottom:i<props.clients.length-1?'1px solid '+BD:'none'}},
              e('div',{},
                e('div',{style:{fontWeight:'700',color:DK}},c.name),
                e('div',{style:{fontSize:'12px',color:MID}},c.category+' · '+c.tier)
              ),
              e('div',{style:{textAlign:'right'}},
                e('div',{style:{padding:'2px 8px',borderRadius:'20px',fontSize:'11px',fontWeight:'700',background:sc+'22',color:sc}},c.status),
                e('div',{style:{fontSize:'12px',color:G,fontWeight:'700',marginTop:'2px'}},'$'+c.revenue.toLocaleString())
              )
            );
          })
        )
      )
    );
  }

  function App() {
    var viewState = React.useState('dashboard');
    var view = viewState[0], setView = viewState[1];
    var clientsState = React.useState(function(){try{var saved=JSON.parse(localStorage.getItem('fashionvault_brands_v2'));return Array.isArray(saved)&&saved.every(function(c){return c&&typeof c.name==='string'&&typeof c.category==='string'&&typeof c.revenue==='number'&&typeof c.placements==='number'})?saved:INIT_CLIENTS}catch(err){return INIT_CLIENTS}});
    var clients = clientsState[0], setClients = clientsState[1];
    useEffect(function(){try{localStorage.setItem('fashionvault_brands_v2',JSON.stringify(clients))}catch(err){}},[clients]);
    var keyState = React.useState(function(){try{return sessionStorage.getItem('vaultai_key')||''}catch{return ''}});
    var apiKey = keyState[0], setApiKey = keyState[1];
    var showKeyState = React.useState(false);
    var showKey = showKeyState[0], setShowKey = showKeyState[1];

    function saveKey(k){setApiKey(k);try{sessionStorage.setItem('vaultai_key',k)}catch{}setShowKey(false);}
    function onboardComplete(data){
      if(data.brandName){
        setClients(function(cs){return cs.concat([{id:Date.now(),name:data.brandName.toUpperCase(),category:data.category,status:'Intake',placements:0,revenue:0,tier:'Starter',pieces:parseInt(data.pieces)||0,contact:data.email}])});
      }
      setView('dashboard');
    }

    return e('div',{},
      showKey&&e(KeyModal,{onSave:saveKey,onClose:function(){setShowKey(false)}}),
      view==='onboarding'&&e(Onboarding,{onComplete:onboardComplete,onCancel:function(){setView('dashboard')}}),
      view==='dashboard'&&e(Dashboard,{clients:clients,setClients:setClients,setView:setView,apiKey:apiKey,onKeyClick:function(){setShowKey(true)}}),
      view==='backend'&&e(Backend,{clients:clients,setView:setView})
    );
  }

  document.getElementById('load-status').textContent = 'Mounting React app…';
  ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));

} catch(err) {
  var box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = 'SETUP ERROR:\n' + err.message + '\n\n' + err.stack;
}
</script>
</body>
</html>
