<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNC FashionVault — AI Placement Platform</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#F5F7FA;color:#1A2B3C}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:4px}
    input,select,textarea,button{font-family:'Inter',sans-serif}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fade{animation:fadeIn 0.3s ease}
    .spin{animation:spin 1s linear infinite}
    input:focus,textarea:focus,select:focus{outline:none;border-color:#00C853!important}
    button:hover{opacity:0.88}
    button:disabled{cursor:not-allowed!important;opacity:0.6}
  </style>
</head>
<body>
<div id="root" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div style="text-align:center;font-family:'Space Grotesk',sans-serif;color:#8C9BAB">
    <div style="font-size:32px;margin-bottom:8px">👗</div>
    <div style="font-size:14px;font-weight:600;letter-spacing:0.05em">LOADING FASHIONVAULT…</div>
  </div>
</div>
<script>
const e = React.createElement;
const {useState, useEffect, useRef, useCallback} = React;

// Colors
const G="#00C853",GL="#E8FFF2",A="#FFB300",AL="#FFF8E1",N="#0D1B2A",C="#FF5252",CL="#FFF0F0",W="#FFFFFF",BG="#F5F7FA",BD="#E2E8F0",MID="#8C9BAB",DK="#1A2B3C";

const FASHION_AI = `You are VAULTAI, the AI placement engine for VNC FashionVault — the #1 automated fashion placement platform. You place clothing brands with stylists, influencers, and retail buyers to generate revenue.

EXPERTISE:
- Editorial Placement (Vogue, Harper's, Elle, WWD, Hypebeast, Complex)
- Stylist Outreach (celebrity, editorial, commercial, TV/film)
- Influencer Campaigns (nano 1K-10K, micro 10K-100K, macro 100K-1M, mega 1M+)
- Retail Buyer Pitches (boutiques, specialty stores, department stores, online retail)
- PR & Press (lookbooks, line sheets, press kits, sample loan programs)
- Wholesale & Consignment (Net 30/60/90, MOQ, sell-through, margin strategy)
- Trade Show Strategy (Magic, Coterie, Agenda, Project, NYFW, Capsule)
- Celebrity Dressing (stylist relationships, red carpet, loan agreements)
- Campaign Development (capsule drops, collab pitches, UGC strategy)

PERSONALITY: Direct, strategic, energetic. You speak in results — placements, revenue, timelines. No fluff. Every answer has an action in it.`;

const INIT_CLIENTS = [
  {id:1,name:"AUREUM NOIR",category:"Luxury RTW",status:"Active",placements:14,revenue:52400,target:"Women 25–38",tier:"Gold",joinDate:"2026-01-12",pieces:28,campaigns:3,contact:"aria@aureumnoir.com"},
  {id:2,name:"VOID STUDIOS",category:"Streetwear",status:"Outreach",placements:6,revenue:14800,target:"Unisex 18–28",tier:"Silver",joinDate:"2026-02-20",pieces:18,campaigns:1,contact:"kai@voidstudios.co"},
  {id:3,name:"TERRA CO.",category:"Sustainable",status:"Negotiation",placements:9,revenue:33200,target:"Women 28–42",tier:"Gold",joinDate:"2025-12-05",pieces:34,campaigns:2,contact:"maya@terracollective.com"},
  {id:4,name:"NXGEN ATELIER",category:"Avant-Garde",status:"Intake",placements:0,revenue:0,target:"Unisex 22–35",tier:"Starter",joinDate:"2026-06-10",pieces:12,campaigns:0,contact:"leo@nxgenatelier.com"},
];

const ACTIVITY = [
  {brand:"AUREUM NOIR",action:"Vogue editorial confirmed",type:"editorial",time:"2h ago",value:"$8,200"},
  {brand:"TERRA CO.",action:"Nordstrom buyer call scheduled",type:"retail",time:"4h ago",value:"$22K PO"},
  {brand:"VOID STUDIOS",action:"@hypebeast gifting shipped",type:"influencer",time:"6h ago",value:"1.2M reach"},
  {brand:"AUREUM NOIR",action:"Celebrity stylist pulled samples",type:"stylist",time:"1d ago",value:"Jamie Mizrahi"},
  {brand:"TERRA CO.",action:"Micro influencer wave live (12 posts)",type:"influencer",time:"1d ago",value:"480K reach"},
  {brand:"AUREUM NOIR",action:"Revolve reorder PO #4421",type:"retail",time:"2d ago",value:"$6,800"},
];

const typeColor={editorial:G,retail:A,influencer:C,stylist:N};
const statusColor={Active:G,Outreach:A,Negotiation:C,Intake:MID};

// ─── helpers ───
function s(base, extra) { return Object.assign({}, base, extra); }

function Btn({children, onClick, color=G, disabled, full, sm}) {
  return e('button', {
    onClick, disabled,
    style:{background:disabled?BD:color,color:W,border:'none',borderRadius:'10px',
      padding:sm?'7px 14px':'11px 22px',fontSize:sm?'12px':'13px',fontWeight:'700',
      cursor:disabled?'not-allowed':'pointer',width:full?'100%':'auto',
      letterSpacing:'0.02em',boxShadow:disabled?'none':`0 4px 14px ${color}44`,
      transition:'opacity 0.15s'}
  }, children);
}

function Field({label, value, onChange, placeholder, type='text', opts, rows, req}) {
  const base = {width:'100%',boxSizing:'border-box',border:`1.5px solid ${BD}`,borderRadius:'10px',
    padding:'11px 14px',fontSize:'14px',color:DK,background:W,fontFamily:'Inter,sans-serif',
    transition:'border-color 0.15s'};
  const lbl = e('label',{style:{display:'block',fontSize:'12px',fontWeight:'700',color:DK,marginBottom:'6px',letterSpacing:'0.03em'}},
    label, req && e('span',{style:{color:C,marginLeft:'3px'}},'*'));
  let inp;
  if (opts) {
    inp = e('select',{value,onChange:ev=>onChange(ev.target.value),style:base},
      opts.map(o=>e('option',{key:o,value:o},o)));
  } else if (rows) {
    inp = e('textarea',{value,onChange:ev=>onChange(ev.target.value),placeholder,rows,style:base});
  } else {
    inp = e('input',{type,value,onChange:ev=>onChange(ev.target.value),placeholder,style:base});
  }
  return e('div',{style:{marginBottom:'16px'}},lbl,inp);
}

function Card({children, style:st}) {
  return e('div',{style:s({background:W,borderRadius:'16px',border:`1px solid ${BD}`,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.05)'},st)},children);
}

function StatTile({label,value,sub,color=G}) {
  return e(Card,{style:{flex:1,minWidth:'140px'}},
    e('div',{style:{fontSize:'11px',fontWeight:'700',color:MID,letterSpacing:'0.08em',marginBottom:'8px',textTransform:'uppercase'}},label),
    e('div',{style:{fontSize:'28px',fontWeight:'800',color,fontFamily:"'Space Grotesk',sans-serif",lineHeight:1}},value),
    sub && e('div',{style:{fontSize:'12px',color:MID,marginTop:'4px'}},sub)
  );
}

// ─── API KEY MODAL ───
function KeyModal({onSave}) {
  const [k,setK]=useState('');
  return e('div',{style:{position:'fixed',inset:0,background:'rgba(13,27,42,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:'20px'}},
    e(Card,{style:{maxWidth:'440px',width:'100%'}},
      e('div',{style:{textAlign:'center',marginBottom:'24px'}},
        e('div',{style:{fontSize:'36px',marginBottom:'8px'}},'🔑'),
        e('div',{style:{fontSize:'20px',fontWeight:'800',fontFamily:"'Space Grotesk',sans-serif",color:DK}}, 'Connect Your AI'),
        e('div',{style:{fontSize:'14px',color:MID,marginTop:'6px'}},'Enter your Anthropic API key to activate VAULTAI')
      ),
      e(Field,{label:'Anthropic API Key',value:k,onChange:setK,placeholder:'sk-ant-…',type:'password',req:true}),
      e('div',{style:{fontSize:'11px',color:MID,marginBottom:'16px'}},'Stored locally. Get one at console.anthropic.com'),
      e(Btn,{onClick:()=>k.startsWith('sk-')&&onSave(k),disabled:!k.startsWith('sk-'),full:true,color:G},'🚀 Activate VAULTAI')
    )
  );
}

// ─── ONBOARDING ───
const STEPS=['Brand Story','Collection','Target Market','Goals','Submit'];

function OnboardingPage({onComplete}) {
  const [step,setStep]=useState(0);
  const [data,setData]=useState({brandName:'',website:'',founded:'',story:'',category:'Streetwear',pieces:'',priceMin:'',priceMax:'',fabrication:'',targetGender:'Women',targetAge:'18–25',targetIncome:'Mid-range',channels:'',goals:[],email:'',phone:''});
  const up=(k,v)=>setData(d=>({...d,[k]:v}));
  const cats=['Streetwear','Luxury RTW','Contemporary','Athleisure','Sustainable','Avant-Garde','Denim','Accessories','Swimwear','Bridal'];
  const goalOpts=['Stylist Placements','Influencer Gifting','Editorial Features','Retail Wholesale','Celebrity Dressing','Trade Show'];

  const steps_content = [
    // Step 0: Brand Story
    e('div',{},
      e('div',{style:{fontSize:'22px',fontWeight:'800',fontFamily:"'Space Grotesk',sans-serif",color:DK,marginBottom:'4px'}},'Tell Us Your Brand Story'),
      e('div',{style:{fontSize:'14px',color:MID,marginBottom:'24px'}},'Help VAULTAI understand who you are'),
      e(Field,{label:'Brand Name',value:data.brandName,onChange:v=>up('brandName',v),placeholder:'e.g. VOID STUDIOS',req:true}),
      e(Field,{label:'Website / Instagram',value:data.website,onChange:v=>up('website',v),placeholder:'@yourbrand or website.com'}),
      e(Field,{label:'Founded',value:data.founded,onChange:v=>up('founded',v),placeholder:'e.g. 2023'}),
      e(Field,{label:'Brand Story',value:data.story,onChange:v=>up('story',v),placeholder:'What makes your brand unique?',rows:3})
    ),
    // Step 1: Collection
    e('div',{},
      e('div',{style:{fontSize:'22px',fontWeight:'800',fontFamily:"'Space Grotesk',sans-serif",color:DK,marginBottom:'4px'}},'Your Collection'),
      e('div',{style:{fontSize:'14px',color:MID,marginBottom:'24px'}},'Details about what you make'),
      e(Field,{label:'Category',value:data.category,onChange:v=>up('category',v),opts:cats,req:true}),
      e(Field,{label:'# of Pieces Available',value:data.pieces,onChange:v=>up('pieces',v),placeholder:'e.g. 24',type:'number'}),
      e('div',{style:{display:'flex',gap:'12px'}},
        e('div',{style:{flex:1}},e(Field,{label:'Price Min ($)',value:data.priceMin,onChange:v=>up('priceMin',v),placeholder:'85',type:'number'})),
        e('div',{style:{flex:1}},e(Field,{label:'Price Max ($)',value:data.priceMax,onChange:v=>up('priceMax',v),placeholder:'450',type:'number'}))
      ),
      e(Field,{label:'Fabrication / Materials',value:data.fabrication,onChange:v=>up('fabrication',v),placeholder:'e.g. 100% organic cotton, deadstock denim'})
    ),
    // Step 2: Target Market
    e('div',{},
      e('div',{style:{fontSize:'22px',fontWeight:'800',fontFamily:"'Space Grotesk',sans-serif",color:DK,marginBottom:'4px'}},'Target Market'),
      e('div',{style:{fontSize:'14px',color:MID,marginBottom:'24px'}},'Who wears your brand?'),
      e(Field,{label:'Gender Focus',value:data.targetGender,onChange:v=>up('targetGender',v),opts:['Women','Men','Unisex','Non-binary']}),
      e(Field,{label:'Age Range',value:data.targetAge,onChange:v=>up('targetAge',v),opts:['13–17','18–25','25–35','35–50','50+']}),
      e(Field,{label:'Income Bracket',value:data.targetIncome,onChange:v=>up('targetIncome',v),opts:['Budget','Mid-range','Aspirational','Luxury']}),
      e(Field,{label:'Current Sales Channels',value:data.channels,onChange:v=>up('channels',v),placeholder:'e.g. Shopify, wholesale, pop-ups',rows:2})
    ),
    // Step 3: Goals
    e('div',{},
      e('div',{style:{fontSize:'22px',fontWeight:'800',fontFamily:"'Space Grotesk',sans-serif",color:DK,marginBottom:'4px'}},'Placement Goals'),
      e('div',{style:{fontSize:'14px',color:MID,marginBottom:'24px'}},'What do you want VAULTAI to chase for you?'),
      e('div',{style:{display:'flex',flexWrap:'wrap',gap:'10px',marginBottom:'20px'}},
        goalOpts.map(g=>e('div',{key:g,onClick:()=>up('goals',data.goals.includes(g)?data.goals.filter(x=>x!==g):[...data.goals,g]),
          style:{padding:'10px 16px',borderRadius:'10px',fontSize:'13px',fontWeight:'600',cursor:'pointer',
            border:`2px solid ${data.goals.includes(g)?G:BD}`,
            background:data.goals.includes(g)?GL:W,color:data.goals.includes(g)?G:DK,transition:'all 0.15s'}},g))
      ),
      e(Field,{label:'Contact Email',value:data.email,onChange:v=>up('email',v),placeholder:'you@brand.com',type:'email',req:true}),
      e(Field,{label:'Phone (optional)',value:data.phone,onChange:v=>up('phone',v),placeholder:'+1 (555) 000-0000'})
    ),
    // Step 4: Submit
    e('div',{style:{textAlign:'center',padding:'20px 0'}},
      e('div',{style:{fontSize:'48px',marginBottom:'16px'}},'🎯'),
      e('div',{style:{fontSize:'24px',fontWeight:'800',fontFamily:"'Space Grotesk',sans-serif",color:DK,marginBottom:'8px'}},'You\'re All Set!'),
      e('div',{style:{fontSize:'15px',color:MID,marginBottom:'24px',lineHeight:1.6}},'VAULTAI will analyze your brand and begin building your placement pipeline immediately.'),
      e('div',{style:{background:GL,borderRadius:'12px',padding:'16px',marginBottom:'24px',textAlign:'left'}},
        e('div',{style:{fontSize:'12px',fontWeight:'700',color:G,marginBottom:'8px',letterSpacing:'0.05em'}},'YOUR INTAKE SUMMARY'),
        e('div',{style:{fontSize:'14px',color:DK,fontWeight:'600'}},data.brandName||'Your Brand'),
        e('div',{style:{fontSize:'13px',color:MID}},data.category+' · '+data.targetGender+' '+data.targetAge),
        data.goals.length>0&&e('div',{style:{fontSize:'13px',color:G,marginTop:'4px'}},data.goals.join(', '))
      )
    )
  ];

  return e('div',{style:{minHeight:'100vh',background:BG,display:'flex',flexDirection:'column'}},
    // Header
    e('div',{style:{background:N,padding:'16px 24px',display:'flex',alignItems:'center',gap:'12px'}},
      e('div',{style:{fontSize:'22px'}},'👗'),
      e('div',{style:{fontFamily:"'Space Grotesk',sans-serif",fontWeight:'800',fontSize:'18px',color:W,letterSpacing:'0.05em'}},'VNC FASHIONVAULT'),
      e('div',{style:{marginLeft:'auto',fontSize:'12px',color:'rgba(255,255,255,0.5)',fontWeight:'600'}},`STEP ${step+1} OF ${STEPS.length}`)
    ),
    // Progress bar
    e('div',{style:{height:'3px',background:'rgba(0,200,83,0.15)'}},
      e('div',{style:{height:'100%',background:G,width:`${((step+1)/STEPS.length)*100}%`,transition:'width 0.4s ease'}})
    ),
    // Step tabs
    e('div',{style:{display:'flex',background:W,borderBottom:`1px solid ${BD}`,overflowX:'auto'}},
      STEPS.map((s,i)=>e('div',{key:s,style:{padding:'12px 20px',fontSize:'12px',fontWeight:'700',
        color:i===step?G:i<step?MID:'rgba(140,155,171,0.5)',borderBottom:i===step?`2px solid ${G}`:'2px solid transparent',
        cursor:i<=step?'pointer':'default',whiteSpace:'nowrap',letterSpacing:'0.03em',transition:'color 0.15s'},
        onClick:()=>i<=step&&setStep(i)},s))
    ),
    // Content
    e('div',{style:{flex:1,display:'flex',justifyContent:'center',padding:'24px 16px'}},
      e('div',{style:{width:'100%',maxWidth:'520px'}},
        e(Card,{style:{marginBottom:'20px'}},steps_content[step])
      )
    ),
    // Footer nav
    e('div',{style:{padding:'16px 24px',background:W,borderTop:`1px solid ${BD}`,display:'flex',gap:'12px',justifyContent:'flex-end'}},
      step>0&&e(Btn,{onClick:()=>setStep(s=>s-1),color:N},'← Back'),
      step<STEPS.length-1
        ?e(Btn,{onClick:()=>setStep(s=>s+1),color:G,disabled:step===0&&!data.brandName},'Continue →')
        :e(Btn,{onClick:()=>onComplete(data),color:G},'🚀 Launch My Campaign')
    )
  );
}

// ─── AI CHAT ───
function AIChat({client, apiKey}) {
  const [msgs,setMsgs]=useState([{role:'assistant',content:`VAULTAI online. I'm locked in on **${client.name}** — ${client.category}, ${client.placements} placements, $${client.revenue.toLocaleString()} revenue. What's the move?`}]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);

  useEffect(()=>{bottomRef.current&&bottomRef.current.scrollIntoView({behavior:'smooth'})},[msgs]);

  async function send() {
    if(!input.trim()||loading) return;
    const userMsg=input.trim();
    setInput('');
    setMsgs(m=>[...m,{role:'user',content:userMsg}]);
    setLoading(true);
    try {
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:FASHION_AI+`\n\nCurrent client: ${client.name} | ${client.category} | ${client.placements} placements | $${client.revenue.toLocaleString()} revenue | ${client.pieces} pieces | Tier: ${client.tier}`,messages:[...msgs.filter(m=>m.role!=='system'),{role:'user',content:userMsg}]})
      });
      const d=await res.json();
      setMsgs(m=>[...m,{role:'assistant',content:d.content?.[0]?.text||'Error getting response.'}]);
    } catch(err) {
      setMsgs(m=>[...m,{role:'assistant',content:'Connection error. Check your API key and try again.'}]);
    }
    setLoading(false);
  }

  function MsgBubble({msg}) {
    const isAI=msg.role==='assistant';
    return e('div',{style:{display:'flex',justifyContent:isAI?'flex-start':'flex-end',marginBottom:'12px'}},
      e('div',{style:{maxWidth:'85%',padding:'12px 16px',borderRadius:isAI?'4px 16px 16px 16px':'16px 4px 16px 16px',
        background:isAI?W:G,color:isAI?DK:W,fontSize:'14px',lineHeight:1.6,
        border:isAI?`1px solid ${BD}`:'none',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}},
        msg.content.split('\n').map((line,i)=>e('span',{key:i},line,e('br',{})))
      )
    );
  }

  return e('div',{style:{display:'flex',flexDirection:'column',height:'460px',background:BG,borderRadius:'12px',overflow:'hidden',border:`1px solid ${BD}`}},
    e('div',{style:{background:N,padding:'12px 16px',display:'flex',alignItems:'center',gap:'10px'}},
      e('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:G}}),
      e('div',{style:{fontWeight:'700',fontSize:'13px',color:W,letterSpacing:'0.05em'}},'VAULTAI — '+client.name)
    ),
    e('div',{style:{flex:1,overflowY:'auto',padding:'16px'}},
      msgs.map((m,i)=>e(MsgBubble,{key:i,msg:m})),
      loading&&e('div',{style:{display:'flex',gap:'6px',padding:'8px'}},
        ...[0,1,2].map(i=>e('div',{key:i,style:{width:'8px',height:'8px',borderRadius:'50%',background:MID,animation:`spin 1s ${i*0.2}s infinite`}}))
      ),
      e('div',{ref:bottomRef})
    ),
    e('div',{style:{padding:'12px',background:W,borderTop:`1px solid ${BD}`,display:'flex',gap:'8px'}},
      e('input',{value:input,onChange:ev=>setInput(ev.target.value),onKeyDown:ev=>ev.key==='Enter'&&send(),
        placeholder:'Ask VAULTAI anything about placements…',
        style:{flex:1,border:`1.5px solid ${BD}`,borderRadius:'10px',padding:'10px 14px',fontSize:'14px',color:DK,background:BG}}),
      e(Btn,{onClick:send,disabled:!input.trim()||loading,color:G,sm:true},'Send')
    )
  );
}

// ─── CLIENT CARD ───

    e('div',{style:{fontSize:'12px',color:MID,marginBottom:'10px'}},client.category+' · '+client.tier),
    e('div',{style:{display:'flex',gap:'16px'}},

      e('div',{style:{display:'flex',gap:'8px',marginLeft:'16px'}},
        e('button',{onClick:onKeyClick,style:{background:'rgba(255,179,0,0.15)',color:A,border:'none',padding:'8px 12px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700'}},'🔑 API'),
        e('button',{onClick:()=>setView('backend'),style:{background:'rgba(255,255,255,0.08)',color:'rgba(255,255,255,0.7)',border:'none',padding:'8px 12px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700'}},'ADMIN'),
        e('button',{onClick:()=>setView('onboarding'),style:{background:G,color:W,border:'none',padding:'8px 14px',borderRadius:'8px',cursor:'pointer',fontSize:'12px',fontWeight:'700'}},'+NEW')
      )
    ),

    e('div',{style:{padding:'20px 16px',maxWidth:'1000px',margin:'0 auto'}},
      // Overview tab
      tab==='overview'&&e('div',{className:'fade'},
        e('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'20px'}},
          e(StatTile,{label:'Total Revenue',value:'$'+totalRev.toLocaleString(),sub:'All clients combined',color:G}),
          e(StatTile,{label:'Placements',value:totalPlacements,sub:'Active placements',color:A}),
          e(StatTile,{label:'Clients',value:clients.length,sub:'Brands in vault',color:C}),
          e(StatTile,{label:'Active',value:clients.filter(c=>c.status==='Active').length,sub:'Currently running',color:N})
        ),
        e(Card,{style:{marginBottom:'20px'}},
          e('div',{style:{fontWeight:'800',fontSize:'15px',fontFamily:"'Space Grotesk',sans-serif",marginBottom:'16px',color:DK}},'⚡ LIVE ACTIVITY'),
          ACTIVITY.map((a,i)=>e('div',{key:i,style:{display:'flex',alignItems:'center',gap:'12px',padding:'10px 0',borderBottom:i<ACTIVITY.length-1?`1px solid ${BD}`:'none'}},
            e('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:typeColor[a.type]||G,flexShrink:0}}),
            e('div',{style:{flex:1,minWidth:0}},
              e('div',{style:{fontSize:'13px',fontWeight:'600',color:DK,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},a.action),
              e('div',{style:{fontSize:'11px',color:MID}},a.brand+' · '+a.time)
            ),
            e('div',{style:{fontSize:'12px',fontWeight:'700',color:typeColor[a.type]||G,whiteSpace:'nowrap'}},a.value)
          ))
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:'12px'}},
          clients.map(c=>e(ClientCard,{key:c.id,client:c,apiKey,onSelect:cl=>{setSelClient(cl);setTab('clients')},selected:false}))
        )
      ),

      // Clients tab
      tab==='clients'&&e('div',{className:'fade'},
        e('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:'12px',marginBottom:'20px'}},
          clients.map(c=>e(ClientCard,{key:c.id,client:c,apiKey,onSelect:setSelClient,selected:selClient&&selClient.id===c.id}))
        ),
        selClient&&e(Card,{style:{marginBottom:'0'}},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}},
            e('div',{style:{fontFamily:"'Space Grotesk',sans-serif",fontWeight:'800',fontSize:'16px',color:DK}},'💬 VAULTAI — '+selClient.name),
            e('button',{onClick:()=>setSelClient(null),style:{background:'none',border:'none',fontSize:'18px',cursor:'pointer',color:MID}},'✕')
          ),
          apiKey
            ?e(AIChat,{client:selClient,apiKey})
            :e('div',{style:{padding:'40px',textAlign:'center',color:MID}},
                e('div',{style:{fontSize:'24px',marginBottom:'8px'}},'🔑'),
                e('div',{style:{fontWeight:'600'}},'Add your API key to chat with VAULTAI'),
                e(Btn,{onClick:onKeyClick,color:A},'Add API Key')
              )
        )
      ),

      // Activity tab
      tab==='activity'&&e('div',{className:'fade'},
        e(Card,{},
          e('div',{style:{fontWeight:'800',fontSize:'15px',fontFamily:"'Space Grotesk',sans-serif",marginBottom:'16px',color:DK}},'📋 FULL ACTIVITY LOG'),
          ACTIVITY.map((a,i)=>e('div',{key:i,style:{display:'flex',gap:'12px',padding:'14px 0',borderBottom:i<ACTIVITY.length-1?`1px solid ${BD}`:'none',alignItems:'flex-start'}},
            e('div',{style:{padding:'6px 10px',borderRadius:'8px',fontSize:'11px',fontWeight:'700',background:(typeColor[a.type]||G)+'18',color:typeColor[a.type]||G,whiteSpace:'nowrap'}},a.type.toUpperCase()),
            e('div',{style:{flex:1}},
              e('div',{style:{fontSize:'14px',fontWeight:'600',color:DK,marginBottom:'2px'}},a.action),
              e('div',{style:{fontSize:'12px',color:MID}},a.brand+' · '+a.time)
            ),
            e('div',{style:{fontSize:'13px',fontWeight:'700',color:typeColor[a.type]||G}},a.value)
          ))
        )
      )
    )
  );
}

// ─── BACKEND ───
function BackendPage({clients,setClients,setView}) {
  const [pwd,setPwd]=useState('');
  const [authed,setAuthed]=useState(false);
  const [err,setErr]=useState(false);

  if (!authed) return e('div',{style:{minHeight:'100vh',background:N,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}},
    e(Card,{style:{maxWidth:'400px',width:'100%'}},
      e('div',{style:{textAlign:'center',marginBottom:'24px'}},
        e('div',{style:{fontSize:'36px',marginBottom:'8px'}},'🔒'),
        e('div',{style:{fontSize:'20px',fontWeight:'800',fontFamily:"'Space Grotesk',sans-serif",color:DK}}, 'Backend Access'),
        e('div',{style:{fontSize:'13px',color:MID,marginTop:'4px'}},'Overseer login required')
      ),
      e(Field,{label:'Password',value:pwd,onChange:v=>{setPwd(v);setErr(false)},type:'password',req:true}),
      err&&e('div',{style:{color:C,fontSize:'13px',marginBottom:'12px',fontWeight:'600'}},'Incorrect password'),
      e(Btn,{onClick:()=>{if(pwd==='VNC2026')setAuthed(true);else setErr(true)},full:true,color:N},'🔓 Access Backend'),
      e('div',{style:{textAlign:'center',marginTop:'12px'}}),
      e('button',{onClick:()=>setView('dashboard'),style:{background:'none',border:'none',color:MID,cursor:'pointer',fontSize:'13px',textDecoration:'underline'}},'← Back to Dashboard')
    )
  );

  return e('div',{style:{minHeight:'100vh',background:BG}},
    e('div',{style:{background:N,padding:'14px 24px',display:'flex',alignItems:'center',gap:'12px'}},
      e('div',{style:{fontSize:'20px'}},'🔒'),
      e('div',{style:{fontFamily:"'Space Grotesk',sans-serif",fontWeight:'800',fontSize:'16px',color:W,letterSpacing:'0.05em'}},'FASHIONVAULT BACKEND'),
      e('button',{onClick:()=>setView('dashboard'),style:{marginLeft:'auto',background:'rgba(255,255,255,0.08)',color:W,border:'none',padding:'8px 14px',borderRadius:'8px',cursor:'pointer',fontSize:'13px',fontWeight:'600'}},'← Dashboard')
    ),
    e('div',{style:{padding:'20px 16px',maxWidth:'900px',margin:'0 auto'}},
      e('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'24px'}},
        e(StatTile,{label:'Total Clients',value:clients.length,color:G}),
        e(StatTile,{label:'Total Revenue',value:'$'+clients.reduce((s,c)=>s+c.revenue,0).toLocaleString(),color:A}),
        e(StatTile,{label:'Total Placements',value:clients.reduce((s,c)=>s+c.placements,0),color:C}),
        e(StatTile,{label:'Active Brands',value:clients.filter(c=>c.status==='Active').length,color:N})
      ),
      e(Card,{},
        e('div',{style:{fontWeight:'800',fontSize:'15px',fontFamily:"'Space Grotesk',sans-serif",marginBottom:'16px',color:DK}},'CLIENT ROSTER'),
        e('div',{style:{overflowX:'auto'}},
          e('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'13px'}},
            e('thead',{},e('tr',{},
              ['Brand','Category','Status','Tier','Placements','Revenue','Contact'].map(h=>
                e('th',{key:h,style:{textAlign:'left',padding:'10px 12px',background:BG,color:MID,fontWeight:'700',fontSize:'11px',letterSpacing:'0.05em',borderBottom:`1px solid ${BD}`}},h))
            )),
            e('tbody',{},clients.map((c,i)=>
              e('tr',{key:c.id,style:{borderBottom:`1px solid ${BD}`,background:i%2===0?W:BG}},
                e('td',{style:{padding:'12px',fontWeight:'700',color:DK,fontFamily:"'Space Grotesk',sans-serif",fontSize:'13px'}},c.name),
                e('td',{style:{padding:'12px',color:MID}},c.category),
                e('td',{style:{padding:'12px'}},e('span',{style:{padding:'3px 8px',borderRadius:'20px',fontSize:'11px',fontWeight:'700',background:(statusColor[c.status]||MID)+'22',color:statusColor[c.status]||MID}},c.status)),
                e('td',{style:{padding:'12px',color:MID}},c.tier),
                e('td',{style:{padding:'12px',fontWeight:'700',color:G}},c.placements),
                e('td',{style:{padding:'12px',fontWeight:'700',color:A}},'$'+c.revenue.toLocaleString()),
                e('td',{style:{padding:'12px',color:MID,fontSize:'12px'}},c.contact)
              )
            ))
          )
        )
      )
    )
  );
}

// ─── APP ROOT ───
function App() {
  const [view,setView]=useState('dashboard');
  const [clients,setClients]=useState(INIT_CLIENTS);
  const [apiKey,setApiKey]=useState(()=>{try{return localStorage.getItem('vaultai_key')||''}catch{return ''}});
  const [showKeyModal,setShowKeyModal]=useState(false);

  function saveKey(k) {
    setApiKey(k);
    try{localStorage.setItem('vaultai_key',k)}catch{}
    setShowKeyModal(false);
  }

  function handleOnboardComplete(data) {
    if(data.brandName) {
      setClients(cs=>[...cs,{
        id:Date.now(),name:data.brandName.toUpperCase(),category:data.category,
        status:'Intake',placements:0,revenue:0,target:data.targetGender+' '+data.targetAge,
        tier:'Starter',joinDate:new Date().toISOString().slice(0,10),
        pieces:parseInt(data.pieces)||10,campaigns:0,contact:data.email
      }]);
    }
    setView('dashboard');
  }

  return e('div',{},
    showKeyModal&&e(KeyModal,{onSave:saveKey}),
    view==='onboarding'&&e(OnboardingPage,{onComplete:handleOnboardComplete}),
    view==='dashboard'&&e(Dashboard,{clients,setClients,setView,apiKey,onKeyClick:()=>setShowKeyModal(true)}),
    view==='backend'&&e(BackendPage,{clients,setClients,setView})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App,{}));
</script>
</body>
